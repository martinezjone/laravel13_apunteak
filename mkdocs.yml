site_name: DWS Apunteak Laravel 13 - 2026-2027  
site_description: Laravel apunteak euskaraz
theme:
  name: material
  language: eu
  logo: images/logo.png
  favicon: http://fptxurdinaga.eus/wp-content/uploads/2022/10/favicon-96x96-1.png
  palette:
  - scheme: default
    primary: '#004c95'
    accent: '#e95f15'
  - scheme: slate
    primary: '#004c95'
    accent: '#e95f15'
    toggle:
      icon: material/weather-night
      name: Modu iluna
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - content.code.copy
extra_css:
- stylesheets/extra.css
plugins:
- search
markdown_extensions:
- admonition
- tables
- fenced_code
- attr_list
- pymdownx.superfences
- pymdownx.highlight
nav:
- Hasiera: index.md
- Lehenengo pausuak:
  - Zer da?: Lehenengo pausuak/zer-da.md
  - Instalazioa: Lehenengo pausuak/instalazioa.md
  - Laravel proiektua sortu: Lehenengo pausuak/laravel-proiektua-sortu.md
  - Eta orain zer?: Lehenengo pausuak/eta-orain-zer.md
- Laravel elementuak:
  - Rutak eta kontroladoreak:
    - Rutak: Laravel Elementuak/Rutak eta kontroladoreak/rutak.md
    - Kontroladoreak: Laravel Elementuak/Rutak eta kontroladoreak/kontroladoreak.md
    - Middleware: Laravel Elementuak/Rutak eta kontroladoreak/middleware.md
  - Bistak eta Blade:
    - Bistak: Laravel Elementuak/Bistak/bistak.md
    - Konponenteak: Laravel Elementuak/Bistak/konponenteak.md
    - Layouts: Laravel Elementuak/Bistak/layouts.md
    - 'Konponenteak: adibide gehigarriak': Laravel Elementuak/Bistak/konponenteak-1.md
  - Datu-baseak eta Eloquent:
    - Datu basea sortzen: Laravel Elementuak/Datu baseak/datu-basea-sortzen.md
    - Migrazioak: Laravel Elementuak/Datu baseak/migrazioak.md
    - Eloquent ORM:
      - Eloquent ORM: Laravel Elementuak/Datu baseak/Eloquent ORM/eloquent-orm.md
      - Modeloak: Laravel Elementuak/Datu baseak/Eloquent ORM/modeloak.md
      - Seeders: Laravel Elementuak/Datu baseak/Eloquent ORM/seeders.md
      - Factories: Laravel Elementuak/Datu baseak/Eloquent ORM/factories.md
      - Taulen arteko erlazioak: Laravel Elementuak/Datu baseak/Eloquent ORM/taulen-arteko-erlazioak.md
  - Formularioak eta fitxategiak:
    - Balidazioak: Laravel Elementuak/Formularioak eta fitxategiak/balidazioak.md
    - Irudi bat igo: Laravel Elementuak/Formularioak eta fitxategiak/irudi-bat-igo.md
  - Saioak eta autentifikazioa:
    - Saioak: Laravel Elementuak/Saioak eta autentifikazioa/saioak.md
    - 'Mezuak: error eta success': Laravel Elementuak/Saioak eta autentifikazioa/mezuak-bidali-error-eta-success.md
    - Laravel Breeze: Laravel Elementuak/Saioak eta autentifikazioa/laravel-brezze.md
  - Hizkuntzak:
    - Hizkuntza aldatu: Laravel Elementuak/Hizkuntzak/hizkuntza-aldatu.md
- CRUD praktika:
  - Proiektu bat sortu: CRUD/proiektu-bat-sortu.md
  - Datu basea: CRUD/datu-basea.md
  - All, show, create, edit, delete (Adibideekin): CRUD/all-show-create-edit-delete-adibideekin.md
  - Balidazioa, paginazioa eta hizkuntza: CRUD/balidazioa-paginazioa-eta-hizkuntza.md
  - Erlazioak (1-N): CRUD/erlazioak-1-n.md
  - Erlazioak (N-M): CRUD/erlazioak-n-m.md
- API REST:
  - Sarrera: API/index.md
  - API REST eta JSON: API/01-api-rest-json.md
  - API ibilbideak: API/02-api-ibilbideak.md
  - JSON erantzunak: API/03-json-erantzunak.md
  - API kontrolatzaileak eta CRUD: API/04-kontrolatzaileak-crud.md
  - API Resources: API/05-api-resources.md
  - Balidazioa eta erroreak: API/06-balidazioa-erroreak.md
  - API probak: API/07-api-probak.md
  - Laravel + Vue 3 + Sanctum: API/08-laravel-vue-sanctum.md
- Tresnak:
  - Composer: Tresnak/composer.md
  - Node.js: Tresnak/nodejs.md
  - Git: Tresnak/git.md
  - Git Bash: Tresnak/gitbash.md
  - Laragon: Tresnak/laragon.md
  - Visual Studio - Laravel: Tresnak/visualstudio-laravel.md
  - Artisan: Tresnak/artisan.md
