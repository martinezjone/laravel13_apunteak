site_name: DWS – Laravel apunteak
site_description: Laravel apunteak euskaraz
theme:
  name: material
  language: eu
  palette:
  - scheme: default
    primary: light blue
    accent: deep orange
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - content.code.copy
plugins:
- search
markdown_extensions:
- admonition
- tables
- fenced_code
- attr_list
- pymdownx.superfences
- pymdownx.highlight
nav:
- Hasiera: index.md
- Hasiera:
  - Hasiera: hasiera.md
- Lehenengo pausuak:
  - Zer da?: zer-da.md
  - Instalazioa: instalazioa.md
  - Laravel proiektua sortu: laravel-proiektua-sortu.md
  - Eta orain zer?: eta-orain-zer.md
- Laravel Elementuak:
  - Rutak: rutak.md
  - Kontroladoreak: kontroladoreak.md
  - Bistak:
    - Bistak: bistak.md
    - Konponenteak: konponenteak.md
    - Layouts: layouts.md
  - Datu baseak:
    - Datu baseak: datu-baseak.md
    - Datu basea sortzen: datu-basea-sortzen.md
    - Migrazioak: migrazioak.md
    - Eloquent ORM:
      - Eloquent ORM: eloquent-orm.md
      - Modeloak: modeloak.md
      - Seeders: seeders.md
      - Factories: factories.md
- CRUD:
  - Proiektu bat sortu: proiektu-bat-sortu.md
  - Datu basea: datu-basea.md
