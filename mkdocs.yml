site_name: DWS Apunteak Laravel 13 - 2026-2027  
site_description: Laravel apunteak euskaraz
theme:
  name: material
  language: eu
  logo: images/logo.png
  favicon: http://fptxurdinaga.eus/wp-content/uploads/2022/10/favicon-96x96-1.png
  palette:
  - scheme: default
    primary: '#004c95'
    accent: '#e95f15'
  - scheme: slate
    primary: '#004c95'
    accent: '#e95f15'
    toggle:
      icon: material/weather-night
      name: Modu iluna
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - content.code.copy
extra_css:
- stylesheets/extra.css
plugins:
- search
- i18n:
    docs_structure: folder
    fallback_to_default: true
    reconfigure_material: true
    reconfigure_search: true
    languages:
    - locale: eu
      name: Euskara
      default: true
      build: true
    - locale: es
      name: Castellano
      build: true
      site_name: DWS Apuntes de Laravel 13 - 2026-2027
      site_description: Manual de Laravel en castellano
      nav_translations:
        Hasiera: Inicio
        Lehenengo pausuak: Primeros pasos
        'Zer da?': '¿Qué es?'
        Instalazioa: Instalación
        Laravel proiektua sortu: Crear un proyecto Laravel
        Eta orain zer?: '¿Y ahora qué?'
        Laravel elementuak: Elementos de Laravel
        Rutak eta kontroladoreak: Rutas y controladores
        Rutak: Rutas
        Kontroladoreak: Controladores
        Bistak eta Blade: Vistas y Blade
        Bistak: Vistas
        Konponenteak: Componentes
        'Konponenteak: adibide gehigarriak': 'Componentes: ejemplos adicionales'
        Datu-baseak eta Eloquent: Bases de datos y Eloquent
        Datu basea sortzen: Crear la base de datos
        Migrazioak: Migraciones
        Modeloak: Modelos
        Taulen arteko erlazioak: Relaciones entre tablas
        Formularioak eta fitxategiak: Formularios y archivos
        Balidazioak: Validaciones
        Irudi bat igo: Subir una imagen
        Saioak eta autentifikazioa: Sesiones y autenticación
        Saioak: Sesiones
        'Mezuak: error eta success': 'Mensajes: error y success'
        Hizkuntzak: Idiomas
        Hizkuntza aldatu: Cambiar idioma
        CRUD praktika: Práctica de CRUD
        Proiektu bat sortu: Crear un proyecto
        Datu basea: Base de datos
        'All, show, create, edit, delete (Adibideekin)': 'All, show, create, edit, delete (con ejemplos)'
        'Balidazioa, paginazioa eta hizkuntza': 'Validación, paginación e idioma'
        'Erlazioak (1-N)': 'Relaciones (1-N)'
        'Erlazioak (N-M)': 'Relaciones (N-M)'
        Sarrera: Introducción
        'API REST eta JSON': 'API REST y JSON'
        'API ibilbideak': 'Rutas de API'
        'JSON erantzunak': 'Respuestas JSON'
        'API kontrolatzaileak eta CRUD': 'Controladores de API y CRUD'
        'Balidazioa eta erroreak': 'Validación y errores'
        'API probak': 'Pruebas de API'
        Tresnak: Herramientas
markdown_extensions:
- admonition
- tables
- fenced_code
- attr_list
- pymdownx.superfences
- pymdownx.highlight
nav:
- Hasiera: index.md
- Lehenengo pausuak:
  - Zer da?: Lehenengo pausuak/zer-da.md
  - Instalazioa: Lehenengo pausuak/instalazioa.md
  - Laravel proiektua sortu: Lehenengo pausuak/laravel-proiektua-sortu.md
  - Eta orain zer?: Lehenengo pausuak/eta-orain-zer.md
- Laravel elementuak:
  - Rutak eta kontroladoreak:
    - Rutak: Laravel Elementuak/Rutak eta kontroladoreak/rutak.md
    - Kontroladoreak: Laravel Elementuak/Rutak eta kontroladoreak/kontroladoreak.md
    - Middleware: Laravel Elementuak/Rutak eta kontroladoreak/middleware.md
  - Bistak eta Blade:
    - Bistak: Laravel Elementuak/Bistak/bistak.md
    - Konponenteak: Laravel Elementuak/Bistak/konponenteak.md
    - Layouts: Laravel Elementuak/Bistak/layouts.md
    - 'Konponenteak: adibide gehigarriak': Laravel Elementuak/Bistak/konponenteak-1.md
  - Datu-baseak eta Eloquent:
    - Datu basea sortzen: Laravel Elementuak/Datu baseak/datu-basea-sortzen.md
    - Migrazioak: Laravel Elementuak/Datu baseak/migrazioak.md
    - Eloquent ORM:
      - Eloquent ORM: Laravel Elementuak/Datu baseak/Eloquent ORM/eloquent-orm.md
      - Modeloak: Laravel Elementuak/Datu baseak/Eloquent ORM/modeloak.md
      - Seeders: Laravel Elementuak/Datu baseak/Eloquent ORM/seeders.md
      - Factories: Laravel Elementuak/Datu baseak/Eloquent ORM/factories.md
      - Taulen arteko erlazioak: Laravel Elementuak/Datu baseak/Eloquent ORM/taulen-arteko-erlazioak.md
  - Formularioak eta fitxategiak:
    - Balidazioak: Laravel Elementuak/Formularioak eta fitxategiak/balidazioak.md
    - Irudi bat igo: Laravel Elementuak/Formularioak eta fitxategiak/irudi-bat-igo.md
  - Saioak eta autentifikazioa:
