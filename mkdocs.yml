site_name: DWS – Laravel apunteak
site_description: Laravel apunteak euskaraz
theme:
  name: material
  language: eu
  palette:
  - scheme: default
    primary: light blue
    accent: deep orange
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - content.code.copy
plugins:
- search
markdown_extensions:
- admonition
- tables
- fenced_code
- attr_list
- pymdownx.superfences
- pymdownx.highlight
nav:
- Hasiera: index.md
- Lehenengo pausuak:
  - Zer da?: Lehenengo pausuak/zer-da.md
  - Instalazioa: Lehenengo pausuak/instalazioa.md
  - Laravel proiektua sortu: Lehenengo pausuak/laravel-proiektua-sortu.md
  - Eta orain zer?: Lehenengo pausuak/eta-orain-zer.md
- Laravel Elementuak:
  - Rutak: Laravel Elementuak/rutak.md
  - Kontroladoreak: Laravel Elementuak/kontroladoreak.md
  - Bistak:
    - Bistak: Laravel Elementuak/Bistak/bistak.md
    - Konponenteak: Laravel Elementuak/Bistak/konponenteak.md
    - Layouts: Laravel Elementuak/Bistak/layouts.md
  - Datu baseak:
    - Datu baseak: Laravel Elementuak/Datu baseak/datu-baseak.md
    - Datu basea sortzen: Laravel Elementuak/Datu baseak/datu-basea-sortzen.md
    - Migrazioak: Laravel Elementuak/Datu baseak/migrazioak.md
    - Eloquent ORM:
      - Eloquent ORM: Laravel Elementuak/Datu baseak/Eloquent ORM/eloquent-orm.md
      - Modeloak: Laravel Elementuak/Datu baseak/Eloquent ORM/modeloak.md
      - Seeders: Laravel Elementuak/Datu baseak/Eloquent ORM/seeders.md
      - Factories: Laravel Elementuak/Datu baseak/Eloquent ORM/factories.md
- CRUD:
  - Proiektu bat sortu: CRUD/proiektu-bat-sortu.md
  - Datu basea: CRUD/datu-basea.md
  - All, show, create, edit, delete (Adibideekin): CRUD/all-show-create-edit-delete-adibideekin.md
  - Balidazioa, paginazioa eta hizkuntza: CRUD/balidazioa-paginazioa-eta-hizkuntza.md
  - Erlazioak (1-N): CRUD/erlazioak-1-n.md
  - Erlazioak (N-M): CRUD/erlazioak-n-m.md
- Más:
  - Zelan funtzionatzen du: Más/zelan-funtzionatzen-du.md
  - Laragon: Más/laragon.md
  - Composer: Más/composer.md
  - Nodejs: Más/nodejs.md
  - Git: Más/git.md
  - GitBash: Más/gitbash.md
  - VisualStudio - Laravel: Más/visualstudio-laravel.md
  - Artisan: Más/artisan.md
  - Laravel Brezze: Más/laravel-brezze.md
  - Middleware: Más/middleware.md
  - Saioak: Más/saioak.md
  - Taulen arteko erlazioak: Más/taulen-arteko-erlazioak.md
  - Balidazioak: Más/balidazioak.md
  - Irudi bat igo: Más/irudi-bat-igo.md
  - Hizkuntza aldatu: Más/hizkuntza-aldatu.md
  - Mezuak bidali error eta success: Más/mezuak-bidali-error-eta-success.md
  - Laravel Dump Server: Más/laravel-dump-server.md
